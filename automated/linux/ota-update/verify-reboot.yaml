metadata:
    format: Lava-Test Test Definition 1.0
    name: ota-reboot-verify
    description: "Verify system booted without upgrade after reboot"

    maintainer:
        - milosz.wasilewski@foundries.io
    os:
        - openembedded
    scope:
        - functional

    devices:
        - imx8mm
        - imx6ull

params:
        UBOOT_VAR_TOOL: "fw_printenv"
        TYPE: "kernel"
run:
    steps:
        - cd ./automated/linux/ota-update
        - ./verify-reboot.sh -t "${TYPE}" -u "${UBOOT_VAR_TOOL}"
        - ../../utils/send-to-lava.sh ./output/result.txt
